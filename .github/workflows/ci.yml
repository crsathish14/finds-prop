# CI: the authoritative quality gates (docs/engineering/quality-gates.md, section 7).
# Properties: least-privilege permissions, third-party actions pinned by commit SHA, concurrency
# cancels superseded runs, no secrets, installs with --ignore-scripts, no pull_request_target.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Non-secret placeholders so the build can validate the environment schema. No real keys exist in CI.
  APP_ENV: local
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key

jobs:
  static:
    name: static (format, lint, types, policy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run policy
      - name: Unused code report (G-18, report only until Stage 3)
        run: npx knip
        continue-on-error: true

  pr-policy:
    name: pr-policy (title, template, gate changes)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The script reads the pull request text from the event file as data; nothing is interpolated into a shell.
      - run: node scripts/check-pr.mjs

  unit:
    name: unit (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test

  db:
    name: db (migrations, pgTAP, types)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # The Supabase CLI comes from its action: the npm package downloads a binary in an install
      # script, which --ignore-scripts blocks.
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.122.0
      - run: npm ci --ignore-scripts
      - name: Migrations policy (G-13)
        run: node scripts/check-migrations.mjs --base origin/${{ github.base_ref || 'develop' }}
        env:
          CI: "true"
      - run: supabase start
      - name: Reset without the seed (the database tests assume empty tables)
        run: supabase db reset --no-seed
      - run: supabase db lint --level error
      - run: supabase test db
      - name: Reset with the seed data (S3-T13)
        run: supabase db reset
      - name: Seed tests
        run: supabase test db supabase/seed-tests
      - name: Generated types match the migrations (G-07)
        run: node scripts/gen-types.mjs --check
      - if: always()
        run: supabase stop --no-backup

  build:
    name: build and e2e smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build and scan the client bundle for server secrets (G-09)
        run: npm run build
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end smoke (G-10)
        run: npm run test:e2e:smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  security:
    name: security (audit, secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Dependency audit (G-11)
        run: npm audit --omit=dev --audit-level=high
      - name: Install gitleaks (pinned version and checksum; run as a CLI, no licence needed)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Secret scan (G-12)
        run: ./gitleaks detect --redact --no-banner --config .gitleaks.toml

  all-checks-passed:
    name: all-checks-passed
    if: always()
    needs: [static, pr-policy, unit, db, build, security]
    runs-on: ubuntu-latest
    steps:
      - name: Every required job succeeded (skipped is fine for pr-policy on push events)
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "A required job failed or was cancelled."
            exit 1
          fi
